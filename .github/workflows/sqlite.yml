name: Test SQLite
on: [push, pull_request]

jobs:
  test-latest:
    name: "Active Record 8.1 + Ruby 4.0"
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/Gemfile.activerecord-8.1.x
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run the test suite against SQLite
        run: bundle exec rake test:sqlite3

  test-supported:
    name: "Active Record ${{ matrix.active_record }} + Ruby ${{ matrix.ruby }}"
    needs: [test-latest]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        active_record: ["7.2", "8.0", "8.1"]
        exclude:
          - ruby: "4.0"
            active_record: "8.1"
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/Gemfile.activerecord-${{ matrix.active_record }}.x
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          rubygems: ${{ matrix.rubygems }}
          bundler-cache: true
      - name: Run the test suite against SQLite
        run: bundle exec rake test:sqlite3
